version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - unused

  exclusions:
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling

    rules:
      # Common defer/teardown patterns where errors are safe to ignore
      - linters:
          - errcheck
        text: "Error return value of `[^`]*\\.(Exec|Rollback|Scan|Close|Flush|Write|WriteString|Flock|Remove|RemoveAll|Sscanf|Walk|Copy|Setenv|Unsetenv|MkdirAll|Print|Printf|Println)`"
      # Tests often use unchecked writes/creates — t.Fatal on each adds noise
      - path: '_test\.go'
        linters:
          - errcheck

formatters:
  enable:
    - gofmt
    - goimports

  settings:
    goimports:
      local-prefixes:
        - github.com/flesler/scip-cli-go/v2
