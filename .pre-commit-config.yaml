repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: [--maxkb=1000]

  - repo: local
    hooks:
      - id: go-mod-tidy
        name: go mod tidy
        entry: scripts/pre-commit-mod-tidy.sh
        language: system
        files: go\.(mod|sum)$
        pass_filenames: false

      - id: gofmt
        name: gofmt
        entry: scripts/pre-commit-gofmt.sh
        language: system
        types: [go]

      - id: goimports
        name: goimports
        entry: scripts/pre-commit-goimports.sh
        language: system
        types: [go]

      - id: go-typecheck
        name: go build + vet (typecheck)
        entry: scripts/pre-commit-typecheck.sh
        language: system
        types: [go]
        pass_filenames: false

      - id: golangci-lint
        name: golangci-lint
        entry: scripts/pre-commit-lint.sh
        language: system
        types: [go]
        pass_filenames: false
